[project]
name = "ticketdesk-api"
version = "1.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.34.2",
  "SQLAlchemy==2.0.41",
  "alembic==1.15.2",
  "psycopg[binary]==3.3.9",
  "argon2-cffi==23.1.0",
  "python-multipart==0.0.34",
  "httpx==0.28.1",
  "pytest==8.3.5",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
